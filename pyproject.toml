[project]
name = "story-engine"
version = "0.1.0"
description = "Multi-Agent Chinese Novel Generation System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "litellm>=1.50.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "chromadb>=0.5.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "aiosqlite>=0.20.0",
    # Phase 1: structured LLM output (Pydantic validation + reask) over LiteLLM.
    # Uses instructor.from_litellm — zero-glue with existing gateway.
    "instructor>=1.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    # AC3 corpus builder: traditional→simplified conversion for
    # zh.wikisource.org public-domain excerpts.
    # Used by scripts/build_wikisource_pd_corpus.py.
    "opencc-python-reimplemented>=0.1.7",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
