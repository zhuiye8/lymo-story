<style>

        }

            background: linear-gradient(90deg, #f1eee5 25%, #e5e2da 50%, #f1eee5 75%);

        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .floating-ink {
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }

<body class="bg-surface text-on-surface font-body selection:bg-primary-container selection:text-on-primary-container overflow-x-hidden">
<!-- Top Navigation Shell -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-6 h-16 bg-[#FCF9F0]/80 dark:bg-stone-900/80 backdrop-blur-xl">
<div class="flex items-center gap-4">

<div class="md:col-span-8 h-[400px] bg-surface-container-low p-8 flex flex-col justify-end gap-4">
<div class="h-12 w-3/4 skeleton rounded-lg"></div>
<div class="h-4 w-1/2 skeleton rounded-full"></div>
<div class="space-y-2 mt-4">
<div class="h-3 w-full skeleton rounded-full"></div>
<div class="h-3 w-full skeleton rounded-full"></div>
<div class="h-3 w-4/5 skeleton rounded-full"></div>
</div>
</div>
<!-- Side Skeleton -->
<div class="md:col-span-4 flex flex-col gap-6">
<div class="h-full bg-surface-container-low p-6 flex flex-col gap-4">
<div class="w-24 h-32 skeleton rounded-lg mb-2"></div>
<div class="h-6 w-full skeleton rounded-lg"></div>
<div class="h-4 w-2/3 skeleton rounded-full"></div>
</div>
</div>
</div>

<div class="mt-12 py-12 flex flex-col items-center justify-center text-center">

</div>

<p class="font-label text-sm text-on-surface/60 tracking-wider">Waking up the Lymo spirits...</p>
</div>
</section>
<!-- Divider -->
<div class="w-full h-px bg-surface-variant/30 mb-20"></div>
<!-- SECTION 2: EMPTY STATE -->
<section class="flex flex-col items-center text-center max-w-2xl mx-auto py-16">

<div class="relative mb-12">
<!-- Decorative Layer -->
<div class="absolute -top-12 -left-20 w-64 h-64 bg-primary-container/10 rounded-full blur-3xl"></div>
<div class="relative bg-surface-container-low rounded-2xl p-12 overflow-hidden shadow-sm">

<span class="material-symbols-outlined text-primary/40 text-2xl" data-icon="star">star</span>
<span class="material-symbols-outlined text-primary/40 text-xl" data-icon="star">star</span>
</div>
</div>
</div>
</div>
<h1 class="font-headline text-3xl md:text-4xl text-on-surface font-black mb-6 tracking-tight">
                梦境之扉尚未开启
            </h1>
<p class="font-body text-lg text-on-surface-variant/80 mb-10 leading-relaxed">
                这里的书架空空如也，像是一场还未入眠的午后。不如前往“发现”页面，捕捉几则转瞬即逝的灵狐物语。
            </p>
<div class="flex flex-col sm:flex-row gap-4 items-center">
<button class="bg-gradient-to-br from-primary to-primary-container text-on-primary px-8 py-3 rounded-lg font-label font-bold tracking-widest shadow-md hover:shadow-lg transition-all active:scale-95">
